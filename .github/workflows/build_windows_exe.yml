name: Build NICETECH_biometric Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Compile Executable with PyInstaller
      run: |
        python -m PyInstaller --clean NICETECH_biometric.spec

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NICETECH_biometric-Windows-EXE
        path: dist/NICETECH_biometric.exe
        if-no-files-found: error
